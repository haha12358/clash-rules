name: Generate RULE-SET for Mihomo
on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        run: |
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "fakeip_filter=https://raw.githubusercontent.com/juewuy/ShellCrash/dev/public/fake_ip_filter.list" >> $GITHUB_ENV
          echo "anti_ad_clash=https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-clash.yaml" >> $GITHUB_ENV
          echo "anti_ad_mrs=https://raw.githubusercontent.com/privacy-protection-tools/anti-ad.github.io/master/docs/mihomo.mrs" >> $GITHUB_ENV
          echo "adblock_mihomo_yaml=https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockmihomo.yaml" >> $GITHUB_ENV
          echo "adblock_mihomo_mrs=https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockmihomo.mrs" >> $GITHUB_ENV
        shell: bash

      - name: Checkout the "hidden" branch
        uses: actions/checkout@v7
        with:
          repository: Loyalsoldier/clash-rules
          ref: hidden

      - name: Setup Go for meta-rules-converter
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: Build meta-rules-converter
        run: |
          git clone --depth=1 https://github.com/MetaCubeX/meta-rules-converter.git
          cd meta-rules-converter
          go build -o ../converter .
          cd ..

      - name: Download and unzip `mihomo core`
        run: |
          mihomo_version=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases | grep 'tag_name' | grep -v 'Alpha' | head -n 1 | sed -e 's/.*v/v/' -e 's/".*//')
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${mihomo_version}/mihomo-linux-amd64-${mihomo_version}.gz" | gzip -d > ./mihomo
          chmod +x ./mihomo

      - name: Download Loyalsoldier geoip.dat and geosite.dat
        run: |
          curl -fsSL -o geoip.dat    "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip.dat"
          curl -fsSL -o geosite.dat "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat"
          ls -lh geoip.dat geosite.dat

      - name: Download GeoLite2-ASN.mmdb
        run: |
          curl -fsSL -o GeoLite2-ASN.mmdb "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb"
          ls -lh GeoLite2-ASN.mmdb

      - name: Convert geosite -> meta rule-set
        run: |
          mkdir -p meta-out/geosite
          ./converter geosite -f geosite.dat -o meta-out/geosite

      - name: Convert geoip -> meta rule-set
        run: |
          mkdir -p meta-out/geoip
          ./converter geoip -f geoip.dat -o meta-out/geoip

      - name: Convert ASN -> meta rule-set
        run: |
          mkdir -p meta-out/asn
          ./converter asn -f GeoLite2-ASN.mmdb -o meta-out/asn

      - name: Generate applications file
        run: |
          mv applications.txt applications.yaml
          grep -v 'payload:' applications.yaml | sed -e 's/^[ \t]*- //' > applications.list

      - name: Generate fakeip-filter file
        run: |
          curl -fsSL "${fakeip_filter}" > fakeip-filter.list
          ./mihomo convert-ruleset domain text fakeip-filter.list fakeip-filter.mrs

      - name: Download anti-AD and adblock rules
        run: |
          curl -fsSL -o anti-ad-clash.yaml "${anti_ad_clash}"
          curl -fsSL -o anti-ad-mihomo.mrs "${anti_ad_mrs}"
          curl -fsSL -o adblockmihomo.yaml "${adblock_mihomo_yaml}"
          curl -fsSL -o adblockmihomo.mrs "${adblock_mihomo_mrs}"

      - name: Copy meta artifacts and extras into publish-meta directory
        run: |
          mkdir -p publish-meta
          cp -r meta-out/geosite publish-meta/
          cp -r meta-out/geoip   publish-meta/
          cp -r meta-out/asn      publish-meta/
          mkdir -p publish-meta/other
          cp applications.yaml applications.list publish-meta/other/
          cp fakeip-filter.list fakeip-filter.mrs publish-meta/other/
          cp anti-ad-clash.yaml anti-ad-mihomo.mrs adblockmihomo.yaml adblockmihomo.mrs publish-meta/other/

      - name: Git push assets to "meta" branch
        run: |
          cd publish-meta || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b meta
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin meta
